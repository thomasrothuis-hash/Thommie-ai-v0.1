plugins {
    id 'com.android.application'
}

def ciVersionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
def keystoreFile = System.getenv("KEYSTORE_FILE")
def keystorePassword = System.getenv("KEYSTORE_PASSWORD")

android {
    namespace 'nl.thommie.kiosk'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.thommie.kiosk'
        minSdk 26
        targetSdk 35
        versionCode ciVersionCode
        versionName '1.0.6'
    }

    signingConfigs {
        release {
            if (keystoreFile && keystorePassword) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                storeType 'PKCS12'
                keyAlias 'thommieai'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            if (keystoreFile && keystorePassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.core:core:1.13.1'
}
