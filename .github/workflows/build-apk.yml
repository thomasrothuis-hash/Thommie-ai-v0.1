name: Build MAATJE v1.1.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add Dutch offline wake model
        shell: bash
        run: |
          rm -rf app/src/main/assets/model-nl /tmp/vosk-nl
          mkdir -p app/src/main/assets /tmp/vosk-nl
          curl -L --fail --retry 3             "https://alphacephei.com/vosk/models/vosk-model-small-nl-0.22.zip"             -o /tmp/vosk-nl/model.zip
          unzip -q /tmp/vosk-nl/model.zip -d /tmp/vosk-nl
          mv /tmp/vosk-nl/vosk-model-small-nl-0.22 app/src/main/assets/model-nl
          echo "maatje-nl-v0.22" > app/src/main/assets/model-nl/uuid
          test -f app/src/main/assets/model-nl/am/final.mdl
          test -f app/src/main/assets/model-nl/conf/model.conf
          test -f app/src/main/assets/model-nl/uuid

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/thommie-release.p12"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/thommie-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          gradle --no-daemon assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MAATJE_v1.1.0.apk

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs MAATJE_v1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAATJE_v1.1.0
          path: MAATJE_v1.1.0.apk
          if-no-files-found: error
          retention-days: 30
