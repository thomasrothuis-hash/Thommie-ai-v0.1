plugins {
    id 'com.android.application'
}

def ciVersionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
def keystoreFile = System.getenv("KEYSTORE_FILE")
def keystorePassword = System.getenv("KEYSTORE_PASSWORD")

android {
    namespace 'nl.thommie.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.thommie.ai'
        minSdk 26
        targetSdk 35
        versionCode ciVersionCode
        versionName '0.9.1'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (keystoreFile && keystorePassword) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                storeType 'PKCS12'
                keyAlias 'thommieai'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            if (keystoreFile && keystorePassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}


dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
