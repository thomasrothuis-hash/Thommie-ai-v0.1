plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.thommie.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.thommie.ai'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
